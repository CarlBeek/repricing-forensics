name: Deploy web server

# Runs on every push to master (and on-demand via the dispatch button).
# The consumer-side rewrite removed the old hourly pipeline — the web
# server now attaches the producer DuckDB directly and notices file
# updates via mtime, so there's no analysis work for CI to do. This
# workflow exists only to roll out code changes.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, reth-server]
    steps:
      - uses: actions/checkout@v4

      - name: Recreate Python venv
        run: |
          rm -rf .venv
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -e .

      - name: Smoke-test the new code
        # Boots the app against an ephemeral synthetic fixture — catches
        # import / SQL / startup errors before we restart the live
        # service. The live service uses PRODUCER_DB_PATH from the
        # systemd unit and never sees this fixture.
        run: |
          . .venv/bin/activate
          python scripts/build_synthetic_producer_db.py --out /tmp/ci-smoke.sqlite --blocks 2
          PRODUCER_DB_PATH=/tmp/ci-smoke.sqlite python -c "
          from repricing_forensics.web.app import app
          from repricing_forensics.web.db import get_conn
          conn = get_conn()
          rows = conn.execute('SELECT count(*) FROM divergences').fetchone()
          assert rows[0] > 0, f'no synthetic divergences? got {rows}'
          print('smoke test ok')
          "
          rm -f /tmp/ci-smoke.sqlite /tmp/ci-smoke.sqlite-wal /tmp/ci-smoke.sqlite-shm

      - name: Point systemd unit at the producer DB
        # reth-research writes the producer SQLite file (path below) on
        # the runner user. We write a systemd drop-in to set
        # PRODUCER_DB_PATH on the eip7904-web unit so it doesn't fall
        # back to the synthetic-fixture path. Idempotent — rewritten
        # each deploy.
        run: |
          PRODUCER_DB_PATH="$HOME/reth/divergences.sqlite"
          sudo mkdir -p /etc/systemd/system/eip7904-web.service.d
          printf "[Service]\nEnvironment=PRODUCER_DB_PATH=%s\nTimeoutStopSec=20\n" "$PRODUCER_DB_PATH" \
            | sudo tee /etc/systemd/system/eip7904-web.service.d/producer.conf > /dev/null
          sudo systemctl daemon-reload

      - name: Restart web server
        run: sudo systemctl restart eip7904-web || echo "Web server service not configured — skipping restart"

      - name: Check service health
        # Surface systemd status + recent logs in the action output so
        # a failing startup doesn't silently leave the site 502'ing.
        # Always runs, even on previous failures, so we have evidence.
        if: always()
        run: |
          sleep 5
          echo "=== systemctl status ==="
          sudo systemctl status eip7904-web --no-pager -l || true
          echo
          echo "=== journalctl (last 80 lines) ==="
          sudo journalctl -u eip7904-web -n 80 --no-pager || true
          echo
          echo "=== local healthz probe ==="
          for i in {1..30}; do
            if curl -fsS -o /dev/null -w "local HTTP %{http_code} in %{time_total}s\n" \
              http://127.0.0.1:8000/healthz; then
              local_ok=1
              break
            fi
            sleep 2
          done
          test "${local_ok:-0}" = "1"

          echo
          echo "=== external healthz probe ==="
          for i in {1..30}; do
            if curl -fsS -o /dev/null -w "external HTTP %{http_code} in %{time_total}s\n" \
              https://repricing-forensics.carlbeek.com/healthz; then
              external_ok=1
              break
            fi
            sleep 2
          done
          test "${external_ok:-0}" = "1"
