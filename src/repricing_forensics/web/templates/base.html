<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gas Repricing Impact Analysis{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/style.css?v={{ cache_bust }}">
  <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
</head>
<body>
  <nav>
    <a href="/" class="nav-brand">Repricing</a>
    <div class="nav-links">
      <a href="/" {% if active == "home" %}class="active"{% endif %}>Home</a>
      <a href="/eip7904" {% if active == "eip7904" %}class="active"{% endif %}>EIP-7904</a>
      <a href="/eip8037" {% if active == "eip8037" %}class="active"{% endif %}>EIP-8037</a>
      <a href="/affected" {% if active == "affected" %}class="active"{% endif %}>Affected Parties</a>
      <a href="/about" {% if active == "about" %}class="active"{% endif %}>About</a>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle CRT / Clean theme">CRT</button>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <hr>
    <p class="note">Gas repricing analysis <span style="margin:0 6px; opacity:0.3">&middot;</span> <span id="activeSchedule"></span> <span style="margin:0 6px; opacity:0.3">&middot;</span> <span id="lastUpdated"></span></p>
  </footer>

  <script>
    // Theme toggle — persisted in localStorage
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'clean' ? 'crt' : 'clean';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      document.querySelector('.theme-toggle').textContent = next === 'crt' ? 'CRT' : 'CLEAN';
      // Re-render any existing Plotly charts with new colors
      if (window.updatePlotlyTheme) window.updatePlotlyTheme();
    }
    // Apply saved theme immediately (before render)
    (function() {
      const saved = localStorage.getItem('theme') || 'crt';
      document.documentElement.setAttribute('data-theme', saved);
      document.addEventListener('DOMContentLoaded', () => {
        document.querySelector('.theme-toggle').textContent = saved === 'crt' ? 'CRT' : 'CLEAN';
      });
    })();
  </script>
  <script>
    // Producer-side schedule names exposed to JS. Page-specific pages
    // (/eip7904, /eip8037) set PAGE_SCHEDULE so their fetchJSON calls
    // route to one schedule. Multi-EIP pages (landing, /affected) read
    // the two SCHEDULE_* constants directly.
    const SCHEDULE_7904 = "{{ schedule_7904 }}";
    const SCHEDULE_8037 = "{{ schedule_8037 }}";
    const PAGE_SCHEDULE = {% if schedule %}"{{ schedule }}"{% else %}null{% endif %};
  </script>
  <script src="/static/app.js?v={{ cache_bust }}"></script>
  <script>
    // Metadata for the footer. Single-EIP pages report that schedule's
    // block range; cross-EIP pages fall back to the 7904 range plus the
    // combined affected-contracts count (the consumer accepts both
    // `schedule` and `schedule_7904`/`schedule_8037` params here).
    const metaUrl = PAGE_SCHEDULE
      ? `/api/metadata?schedule=${encodeURIComponent(PAGE_SCHEDULE)}`
      : `/api/metadata?schedule=${encodeURIComponent(SCHEDULE_7904)}`
        + `&schedule_7904=${encodeURIComponent(SCHEDULE_7904)}`
        + `&schedule_8037=${encodeURIComponent(SCHEDULE_8037)}`;
    window.__repricingMetadata = fetchJSON(metaUrl);
    window.__repricingMetadata.then(m => {
      document.getElementById('activeSchedule').textContent = m.schedule_name || '';
      document.getElementById('lastUpdated').textContent =
        'Updated ' + new Date(m.last_updated).toLocaleString();
    }).catch(() => {
      document.getElementById('activeSchedule').textContent = '';
      document.getElementById('lastUpdated').textContent = 'Updated time unavailable';
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
