{% extends "base.html" %}
{% block title %}Transaction — Gas Repricing Impact Analysis{% endblock %}

{% block content %}
<p style="margin-bottom:16px"><a id="backLink" href="/affected">&larr; Back</a></p>
<div id="txDetail">
  <div class="skeleton skeleton-text" style="width:50%;height:24px;margin-bottom:12px"></div>
  <div class="skeleton skeleton-text" style="width:90%;margin-bottom:20px"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
    <div class="skeleton" style="height:120px;border-radius:var(--radius)"></div>
    <div class="skeleton" style="height:120px;border-radius:var(--radius)"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const TX_HASH = "{{ tx_hash }}";

// ── Function signature resolution ───────────────────────────────────
const _sigCache = {};
async function resolveSelectors(selectors) {
  const unknown = selectors.filter(s => s && s.length === 10 && !(s in _sigCache));
  if (unknown.length) {
    try {
      const hex = unknown.join(',');
      const resp = await fetch(`https://api.openchain.xyz/signature-database/v1/lookup?function=${encodeURIComponent(hex)}`);
      const data = await resp.json();
      if (data.ok && data.result && data.result.function) {
        for (const [sel, matches] of Object.entries(data.result.function)) {
          if (matches && matches.length > 0) {
            _sigCache[sel] = matches[0].name; // e.g. "transferFrom(address,address,uint256)"
          }
        }
      }
    } catch (e) { /* signature lookup is best-effort */ }
  }
  // Mark unknowns so we don't retry
  for (const s of unknown) { if (!(s in _sigCache)) _sigCache[s] = null; }
}

function fmtSelector(selector) {
  if (!selector) return '';
  const sig = _sigCache[selector];
  if (sig) {
    // Show short name, full sig on hover
    const name = sig.split('(')[0];
    return `<span title="${escHtml(sig)}" style="color:var(--accent)">${escHtml(name)}</span><span class="mono" style="color:var(--text-dim); margin-left:4px">${selector}</span>`;
  }
  return `<span class="mono" style="color:var(--text-dim)">${selector}</span>`;
}

// ── Call stack tree rendering ────────────────────────────────────────
function renderCallStack(stack) {
  if (!stack || !stack.length) return '<p class="note">No call stack data available.</p>';
  return stack.map(f => {
    const pct = f.gas_provided > 0 ? Math.round(f.gas_used / f.gas_provided * 100) : 0;
    const barWidth = Math.min(pct, 100);
    const barColor = f.success ? 'var(--green)' : 'var(--red)';
    const statusLabel = f.success ? 'OK' : 'FAIL';
    const indent = f.depth * 24;
    return `
      <div class="call-frame" style="margin-left:${indent}px; ${!f.success ? 'border-color:var(--red);' : ''}">
        <div class="call-frame-header">
          <span class="call-frame-type">${escHtml(f.call_type)}</span>
          <span style="color:${barColor}; font-weight:600; font-size:0.82em">${statusLabel}</span>
        </div>
        <div class="call-frame-target">
          <strong>${escHtml(f.to)}</strong>
          <span class="mono" title="${f.to_address}" style="color:var(--text-dim); font-size:0.8em; margin-left:6px">${(f.to_address || '').slice(0, 10)}...</span>
        </div>
        ${f.selector ? `<div class="call-frame-fn">${fmtSelector(f.selector)}</div>` : ''}
        <div class="call-frame-gas">
          <div class="call-frame-gas-bar">
            <div class="call-frame-gas-fill" style="width:${barWidth}%; background:${barColor}"></div>
          </div>
          <span class="call-frame-gas-label">${fmtGas(f.gas_used)} / ${fmtGas(f.gas_provided)} gas (${pct}%)</span>
        </div>
      </div>`;
  }).join('');
}

// ── Sankey ───────────────────────────────────────────────────────────
function renderCallSankey(divId, stack) {
  if (!stack || stack.length < 1) return;
  const nodeLabels = [stack[0].from];
  const nodeColors = ['rgba(255,184,48,0.7)'];
  const frameToNode = new Map();

  stack.forEach((f, i) => {
    const sig = _sigCache[f.selector];
    const fnName = sig ? sig.split('(')[0] : (f.selector || '');
    nodeLabels.push(`${f.to}\n${fnName}`);
    nodeColors.push(f.success ? 'rgba(255,208,112,0.4)' : 'rgba(138,112,48,0.4)');
    frameToNode.set(i, nodeLabels.length - 1);
  });

  const sources = [], targets = [], values = [], linkColors = [], linkLabels = [];
  const depthStack = [0];

  stack.forEach((f, i) => {
    const nodeIdx = frameToNode.get(i);
    const parentNode = f.depth === 0 ? 0 : (depthStack[f.depth] || 0);
    sources.push(parentNode);
    targets.push(nodeIdx);
    values.push(Math.max(f.gas_used, 1));
    linkColors.push(f.success ? 'rgba(255,208,112,0.1)' : 'rgba(138,112,48,0.15)');
    linkLabels.push(`${fmtGas(f.gas_used)} / ${fmtGas(f.gas_provided)} gas (${f.gas_provided > 0 ? Math.round(f.gas_used / f.gas_provided * 100) : 0}%)`);
    depthStack[f.depth + 1] = nodeIdx;
  });

  Plotly.newPlot(divId, [{
    type: 'sankey', orientation: 'h',
    node: { label: nodeLabels, color: nodeColors, pad: 20, thickness: 20, line: { width: 0 } },
    link: { source: sources, target: targets, value: values, color: linkColors,
            customdata: linkLabels, hovertemplate: '%{customdata}<extra></extra>' },
  }], layout({
    title: { text: 'Gas Flow Through Call Stack' },
    height: Math.max(300, stack.length * 50 + 100),
  }), { responsive: true });
}

function fmtMultiplier(n) { return n == null ? 'n/a' : `${Number(n).toFixed(3)}x`; }

// The tx page compares the two schedules side by side. Each column is one
// EIP's view of the same transaction; a tx may diverge under one, both, or
// neither (a column with no divergence row reads "not affected").
const EIPS = [
  { key: '7904', name: 'EIP-7904', sub: 'Opcode repricing', schedule: SCHEDULE_7904 },
  { key: '8037', name: 'EIP-8037', sub: 'State gas',        schedule: SCHEDULE_8037 },
];
// Which column to highlight: set when arriving from a schedule-scoped link
// (e.g. a sample-tx row on the affected page).
const CAME_FROM = new URLSearchParams(location.search).get('schedule');

function verdictFor(tx) {
  if (tx.baseline_success && !tx.schedule_success)
    return { label: 'Breaks · success → revert', cls: 'verdict-red' };
  if (!tx.baseline_success && tx.schedule_success)
    return { label: 'Rescued · revert → success', cls: 'verdict-green' };
  if (tx.gas_delta !== 0)
    return {
      label: `Still ${tx.schedule_success ? 'succeeds' : 'reverts'} · gas ${tx.gas_delta >= 0 ? '+' : ''}${fmtGas(tx.gas_delta)}`,
      cls: tx.gas_delta > 0 ? 'verdict-orange' : 'verdict-green',
    };
  return { label: 'No outcome change', cls: 'verdict-green' };
}

function opcodeTable(tx, tableId) {
  const ob = tx.opcode_breakdown || [];
  if (!ob.length) return '<p class="note">No per-opcode data recorded for this schedule.</p>';
  const deltaColor = d => d > 0 ? 'var(--red)' : d < 0 ? 'var(--green)' : 'var(--text-dim)';
  return `
    <table id="${tableId}" style="font-size:0.92em">
      <thead><tr>
        <th onclick="sortTable('${tableId}',0)">Opcode</th>
        <th onclick="sortTable('${tableId}',1)" style="text-align:right">Hits</th>
        <th onclick="sortTable('${tableId}',2)" style="text-align:right">Baseline</th>
        <th onclick="sortTable('${tableId}',3)" style="text-align:right">Schedule</th>
        <th onclick="sortTable('${tableId}',4)" style="text-align:right">&Delta;</th>
      </tr></thead>
      <tbody>
        ${ob.map(o => `
          <tr ${o.repriced ? 'style="background:var(--orange-bg)"' : ''}>
            <td><code>${escHtml(o.name)}</code></td>
            <td style="text-align:right" data-sort="${o.count}">${o.count.toLocaleString()}</td>
            <td style="text-align:right" data-sort="${o.gas_baseline}">${fmtGas(o.gas_baseline)}</td>
            <td style="text-align:right" data-sort="${o.gas_schedule}">${fmtGas(o.gas_schedule)}</td>
            <td style="text-align:right; color:${deltaColor(o.gas_delta)}" data-sort="${o.gas_delta}">${o.gas_delta >= 0 ? '+' : ''}${fmtGas(o.gas_delta)}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

function renderColumn(eip, tx) {
  const highlight = (CAME_FROM && CAME_FROM === eip.schedule)
    ? 'box-shadow:0 0 0 2px var(--accent);' : '';
  const head = `<div style="font-size:0.72em; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin-bottom:8px"><strong style="color:var(--text)">${eip.name}</strong> · ${eip.sub}</div>`;
  if (!tx || !tx.found) {
    return `<div style="background:var(--bg-card); border:1px solid var(--border); padding:16px; ${highlight}">
      ${head}
      <p class="note">Not affected — no divergence recorded under ${eip.name}.</p>
    </div>`;
  }
  const v = verdictFor(tx);
  const limit = tx.gas_limit || 0;
  const basePct = limit ? Math.round(tx.baseline_gas_used / limit * 100) : 0;
  const schedPct = limit ? Math.round(tx.schedule_gas_used / limit * 100) : 0;

  let diag = '';
  if (tx.divergence) diag += `
    <div style="margin:8px 0; padding:8px 10px; background:var(--orange-bg); border:1px solid var(--orange-border); font-size:0.85em">
      <strong>First divergence:</strong> <code>${escHtml(tx.divergence.opcode)}</code>
      at depth ${tx.divergence.call_depth ?? '?'} in ${escHtml(tx.divergence.contract)}
    </div>`;
  if (tx.oog) {
    let chainTag = '';
    if (tx.oog.chain_proportional === true) {
      chainTag = ` <span class="oog-chip oog-chip-fix" title="Every CALL from root to OOG forwarded gas via EIP-150 63/64 — raising the wallet's gas clears it.">wallet-fixable</span>`;
    } else if (tx.oog.chain_proportional === false) {
      const kind = tx.oog.bottleneck_kind || 'bottleneck';
      chainTag = ` <span class="oog-chip oog-chip-broken">${escHtml(kind)}</span>`;
    }
    diag += `
    <div style="margin:8px 0; padding:8px 10px; background:var(--red-bg); border:1px solid var(--red-border); font-size:0.85em">
      <strong>Out of gas:</strong> <code>${escHtml(tx.oog.opcode)}</code>
      at depth ${tx.oog.call_depth ?? '?'} in ${escHtml(tx.oog.contract)}${chainTag}
    </div>`;
  }

  // State-gas block — only meaningful for 8037.
  let stateHtml = '';
  const s = tx.eip8037 || {};
  if (eip.key === '8037') {
    stateHtml = `
      <table style="font-size:0.9em; margin-top:8px"><tbody>
        <tr><td>State gas</td><td style="text-align:right">${fmtGas(s.schedule_state_gas_spent)}</td></tr>
        <tr><td>Runtime state gas</td><td style="text-align:right">${fmtGas(s.runtime_state_gas)}</td></tr>
        <tr><td>Reservoir spillover</td><td style="text-align:right">${fmtGas(s.runtime_state_gas_spillover)}</td></tr>
        <tr><td>Min multiplier to pass</td><td style="text-align:right">${fmtMultiplier(s.min_multiplier_to_succeed)}</td></tr>
        <tr><td>Category</td><td style="text-align:right"><code>${escHtml(s.state_gas_category || '—')}</code></td></tr>
      </tbody></table>`;
  }

  const opsTotal = tx.op_counts ? tx.op_counts.total : 0;
  return `<div style="background:var(--bg-card); border:1px solid var(--border); padding:16px; ${highlight}">
    ${head}
    <div class="verdict-banner ${v.cls}" style="margin:0 0 10px">${v.label}</div>
    <table style="font-size:0.9em"><tbody>
      <tr><td>Baseline</td><td style="text-align:right">${fmtGas(tx.baseline_gas_used)} (${basePct}%) <span style="color:${tx.baseline_success ? 'var(--green)' : 'var(--red)'}">${tx.baseline_success ? 'OK' : 'FAIL'}</span></td></tr>
      <tr><td>Schedule</td><td style="text-align:right">${fmtGas(tx.schedule_gas_used)} (${schedPct}%) <span style="color:${tx.schedule_success ? 'var(--green)' : 'var(--red)'}">${tx.schedule_success ? 'OK' : 'FAIL'}</span></td></tr>
      <tr><td>Gas &Delta;</td><td style="text-align:right">${tx.gas_delta >= 0 ? '+' : ''}${fmtGas(tx.gas_delta)}</td></tr>
    </tbody></table>
    ${diag}
    ${stateHtml}
    <h4 style="margin:14px 0 4px">Opcodes hit${opsTotal ? ` <span class="note">(${opsTotal.toLocaleString()} total)</span>` : ''}</h4>
    ${opcodeTable(tx, 'opcodes' + eip.key)}
  </div>`;
}

(async function() {
  const el = document.getElementById('txDetail');
  const [tx7904, tx8037] = await Promise.all([
    fetchJSON(`/api/tx/${encodeURIComponent(TX_HASH)}?schedule=${encodeURIComponent(SCHEDULE_7904)}`).catch(() => ({ found: false })),
    fetchJSON(`/api/tx/${encodeURIComponent(TX_HASH)}?schedule=${encodeURIComponent(SCHEDULE_8037)}`).catch(() => ({ found: false })),
  ]);
  const byEip = { '7904': tx7904, '8037': tx8037 };
  const present = (tx7904 && tx7904.found) ? tx7904 : ((tx8037 && tx8037.found) ? tx8037 : null);

  if (!present) {
    el.innerHTML = '<h1>Transaction Not Found</h1><p>No divergence data for this transaction under either schedule.</p>';
    return;
  }

  if (present.recipient) {
    document.getElementById('backLink').href = `/affected/${present.recipient}`;
    document.getElementById('backLink').textContent = `← ${escHtml(present.recipient_name)}`;
  }

  el.innerHTML = `
    <h1>Transaction Detail</h1>
    <p class="mono" style="color:var(--text-dim); word-break:break-all; margin-bottom:14px">
      ${present.tx_hash}
      <a href="https://etherscan.io/tx/${present.tx_hash}" target="_blank" style="font-size:0.85em; margin-left:8px">etherscan</a>
      <a href="https://lab.ethpandaops.io/ethereum/execution/gas-profiler/tx/${present.tx_hash}?opcodeView=chart&opcodeSort=gas" target="_blank" style="font-size:0.85em; margin-left:8px">gas profiler</a>
    </p>

    <div style="background:var(--bg-card); border:1px solid var(--border); padding:14px 16px; margin-bottom:18px; font-size:0.9em">
      <strong>Block:</strong> ${present.block_number.toLocaleString()} (index ${present.tx_index})
      <span style="margin:0 10px; opacity:0.3">·</span>
      <strong>Gas limit:</strong> ${fmtGas(present.gas_limit)}
      <span style="margin:0 10px; opacity:0.3">·</span>
      <strong>From:</strong> <span class="mono">${(present.sender || '').slice(0, 12)}…</span>
      <span style="margin:0 10px; opacity:0.3">·</span>
      <strong>To:</strong> <a href="/affected/${present.recipient}">${escHtml(present.recipient_name)}</a>
      <span class="mono" style="color:var(--text-dim)">${(present.recipient || '').slice(0, 12)}…</span>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; margin-bottom:24px">
      ${renderColumn(EIPS[0], tx7904)}
      ${renderColumn(EIPS[1], tx8037)}
    </div>

    <div id="stacksArea"></div>
  `;

  // Call stacks differ per schedule. Resolve selectors across both, then
  // render each diverging schedule's stack + gas flow full-width below.
  const allFrames = [...(tx7904.call_stack || []), ...(tx8037.call_stack || [])];
  const selectors = [...new Set(allFrames.map(f => f.selector).filter(Boolean))];
  await resolveSelectors(selectors);

  let stacksHtml = '';
  for (const eip of EIPS) {
    const tx = byEip[eip.key];
    if (tx && tx.found && tx.call_stack && tx.call_stack.length) {
      stacksHtml += `<h2>${eip.name} — call stack &amp; gas flow</h2>
        <div id="sankey${eip.key}"></div>
        <div id="stack${eip.key}"></div>`;
    }
  }
  document.getElementById('stacksArea').innerHTML = stacksHtml || '<p class="note">No call-stack frames captured for this transaction.</p>';

  for (const eip of EIPS) {
    const tx = byEip[eip.key];
    if (tx && tx.found && tx.call_stack && tx.call_stack.length) {
      document.getElementById('stack' + eip.key).innerHTML = renderCallStack(tx.call_stack);
      renderCallSankey('sankey' + eip.key, tx.call_stack);
    }
  }
})();
</script>
{% endblock %}
